<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Crime City (Vehicle Driving)</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #three-js-canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            z-index: 10;
        }
        .ui-text {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        #mini-map-container {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 200px;
            border: 2px solid white;
            border-radius: 10px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        #mini-map-canvas {
            width: 100%;
            height: 100%;
        }
        #interaction-message {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: rgba(255, 255, 255, 0.8);
            color: #333;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 10;
        }
    </style>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
    <canvas id="three-js-canvas"></canvas>
    <div id="ui-container">
        <div class="ui-text">💰 Cash: ₹ <span id="cash-value">5,000,000</span></div>
        <div class="ui-text">💎 RC: <span id="rc-value">5,000,000</span></div>
    </div>
    <div id="mini-map-container">
        <canvas id="mini-map-canvas"></canvas>
    </div>
    <div id="interaction-message">Car mai enter hone ke liye F dabaiye</div>

    <script>
        window.onload = function () {
            // Three.js Scene Setup
            const scene = new THREE.Scene();
            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-js-canvas') });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x87CEEB);
            
            // Camera
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, -20);
            camera.lookAt(0, 0, 0);

            // Cannon.js Physics World
            const world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            const timeStep = 1 / 60;

            // Ground
            const groundShape = new CANNON.Plane();
            const groundBody = new CANNON.Body({ mass: 0 });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);
            
            const groundGeometry = new THREE.PlaneGeometry(1000, 1000);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x32CD32 });
            const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
            groundMesh.rotation.x = -Math.PI / 2;
            scene.add(groundMesh);

            // Player Capsule (with Cannon.js)
            const playerShape = new CANNON.Sphere(0.5);
            const playerBody = new CANNON.Body({ mass: 1, position: new CANNON.Vec3(0, 5, 0) });
            playerBody.addShape(playerShape);
            world.addBody(playerBody);

            const playerGeometry = new THREE.CapsuleGeometry(0.5, 1.8);
            const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x8D6E63 });
            const playerMesh = new THREE.Mesh(playerGeometry, playerMaterial);
            scene.add(playerMesh);

            // Car (with Cannon.js)
            const carShape = new CANNON.Box(new CANNON.Vec3(2.5, 0.75, 1.5));
            const carBody = new CANNON.Body({ mass: 500, position: new CANNON.Vec3(50, 5, 50) });
            carBody.addShape(carShape);
            world.addBody(carBody);

            const carGeometry = new THREE.BoxGeometry(5, 1.5, 3);
            const carMaterial = new THREE.MeshStandardMaterial({ color: 0x0000ff });
            const carMesh = new THREE.Mesh(carGeometry, carMaterial);
            scene.add(carMesh);

            // Player and Car State
            let inCar = false;
            let currentTarget = playerMesh;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(0, 100, 0);
            scene.add(directionalLight);

            // Player Movement Controls
            const keys = {};
            document.addEventListener('keydown', (event) => keys[event.key.toLowerCase()] = true);
            document.addEventListener('keyup', (event) => keys[event.key.toLowerCase()] = false);

            document.addEventListener('keydown', (event) => {
                if (event.key.toLowerCase() === 'f') {
                    if (!inCar) {
                        const distanceToCar = playerMesh.position.distanceTo(carMesh.position);
                        if (distanceToCar < 10) {
                            inCar = true;
                            currentTarget = carMesh;
                            playerMesh.visible = false;
                            document.getElementById('interaction-message').style.display = 'none';
                        }
                    } else {
                        // Exit the car
                        inCar = false;
                        currentTarget = playerMesh;
                        playerMesh.visible = true;
                        // Position the player next to the car
                        const exitPosition = carMesh.position.clone().add(new THREE.Vector3(5, 0, 0));
                        playerBody.position.set(exitPosition.x, exitPosition.y + 5, exitPosition.z);
                    }
                }
                // Key 'E' for deleting the car
                if (event.key.toLowerCase() === 'e') {
                    if (inCar) {
                        // Exit the car first
                        inCar = false;
                        currentTarget = playerMesh;
                        playerMesh.visible = true;
                        const exitPosition = carMesh.position.clone().add(new THREE.Vector3(5, 0, 0));
                        playerBody.position.set(exitPosition.x, exitPosition.y + 5, exitPosition.z);
                    }
                    // Remove car from the scene and physics world
                    scene.remove(carMesh);
                    world.remove(carBody);
                    // Also remove the clone from mini-map scene
                    miniMapScene.remove(carClone);

                }
            });

            function updateMovement() {
                if (!inCar) {
                    const moveDirection = new THREE.Vector3();
                    if (keys['w']) moveDirection.z -= 1;
                    if (keys['s']) moveDirection.z += 1;
                    if (keys['a']) moveDirection.x -= 1;
                    if (keys['d']) moveDirection.x += 1;

                    if (moveDirection.length() > 0) {
                        moveDirection.normalize().multiplyScalar(5);
                        playerBody.velocity.set(moveDirection.x, playerBody.velocity.y, moveDirection.z);
                    } else {
                        playerBody.velocity.set(0, playerBody.velocity.y, 0);
                    }
                } else {
                    const carForce = 500;
                    const carTurn = 2;
                    let force = new CANNON.Vec3(0, 0, 0);
                    let torque = new CANNON.Vec3(0, 0, 0);

                    if (keys['w']) force.z = carForce;
                    if (keys['s']) force.z = -carForce;
                    if (keys['a']) torque.y = carTurn;
                    if (keys['d']) torque.y = -carTurn;

                    const worldForce = carBody.quaternion.vmult(force);
                    carBody.applyLocalForce(worldForce, carBody.position);
                    carBody.applyTorque(torque);
                }
            }

            // Follow Camera
            function updateCamera() {
                const cameraOffset = new THREE.Vector3(0, 15, -20);
                const targetPosition = currentTarget.position.clone();
                const cameraPosition = new THREE.Vector3().copy(targetPosition).add(cameraOffset);
                camera.position.lerp(cameraPosition, 0.1);
                camera.lookAt(targetPosition);
            }

            // Mini-map Setup
            const miniMapCanvas = document.getElementById('mini-map-canvas');
            const miniMapRenderer = new THREE.WebGLRenderer({ canvas: miniMapCanvas });
            miniMapRenderer.setClearColor(0x333333);
            miniMapRenderer.setSize(200, 200);

            const miniMapCamera = new THREE.OrthographicCamera(-500, 500, 500, -500, 1, 1000);
            miniMapCamera.position.y = 500;
            miniMapCamera.lookAt(0, 0, 0);

            const miniMapScene = new THREE.Scene();
            const groundClone = groundMesh.clone();
            miniMapScene.add(groundClone);
            const playerClone = playerMesh.clone();
            playerClone.material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            miniMapScene.add(playerClone);
            const carClone = carMesh.clone();
            carClone.material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            miniMapScene.add(carClone);
            
            // Main Animation Loop
            function animate() {
                requestAnimationFrame(animate);

                world.step(timeStep);
                updateMovement();
                updateCamera();

                // Sync Three.js with Cannon.js
                playerMesh.position.copy(playerBody.position);
                playerMesh.quaternion.copy(playerBody.quaternion);

                carMesh.position.copy(carBody.position);
                carMesh.quaternion.copy(carBody.quaternion);

                // Update interaction message
                const distanceToCar = playerMesh.position.distanceTo(carMesh.position);
                if (distanceToCar < 10 && !inCar) {
                    document.getElementById('interaction-message').style.display = 'block';
                } else {
                    document.getElementById('interaction-message').style.display = 'none';
                }

                renderer.render(scene, camera);

                // Update mini-map position and render
                playerClone.position.copy(playerMesh.position);
                carClone.position.copy(carMesh.position);
                miniMapRenderer.render(miniMapScene, miniMapCamera);
            }

            animate();

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            });
        };
    </script>
</body>
</html>
